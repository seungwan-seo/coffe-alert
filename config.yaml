# 당근 매물 알림 설정
# 키워드는 본문(부동산) / 제목+본문(중고거래)에서 부분 일치로 검사한다.

# ── 양도 매물 우선 ──────────────────────────────────────────────────────────
# 2026-08-23 서울 무인카페 인허가 1,352건 전수 생존분석: 2025년부터 폐업이 2배, 개업 -30%.
# "2~3년차에 지친 사람의 양도"를 받는 게 신규 개업보다 수급상 유리하다 → 봇의 1순위.
# 판정 기준은 matching.handover_grade (카페/커피 업종이 양도 대상이어야 함. 무인 아이스크림·
# 문구점·미용실 양도는 "무인"이 들어 있어도 제외 — 2026-08-24 알림 300건 캘리브레이션).
priority:
  silent_others: true   # true면 🔥 양도가 아닌 알림은 무음으로 보낸다 (브리핑·가격인하는 소리 남).
                        # 폰이 하루 200번 울리는 걸 막고, 🔥만 울리게. 끄려면 false.

realty:
  enabled: true
  freshness_days: 7   # 등록된 지 이 일수 넘은 매물은 알리지 않음 (큐레이션 변동으로 옛 매물이 갑자기 노출되는 경우 방지)
  # 주소가 이 문자열로 시작하면 통과 (예: "서울특별시", "경기도 성남시")
  regions:
    - "서울특별시"
  # 거래 유형: MONTH(월세) BORROW(전세) BUY(매매) SHORT(단기)
  # 월세만 본다. 매매·전세는 목적에 안 맞고, 단기는 카페 창업에 부적합. 비우면 전체 허용.
  trade_types: ["MONTH"]

  # 예산 라벨 — 거르지 않고 알림 앞에 표시만 한다 (STRATEGY §12: 월세 싼 게 목표가 아님).
  # 기준은 "필요잔수" = 하루 몇 잔을 팔아야 회수기한 안에 본전인가 (matching.breakeven_cups).
  #   필요잔수 = (월세 + 고정비 + (권리금+기준투자)÷회수개월) ÷ (잔당 공헌이익×30일)
  #   보증금은 반환금이라 잔수에 안 넣는다 (§11). 대신 💚 상한으로만 검사.
  # 💚 무인카페 최적 = 필요잔수 ≤ green_cups + 보증금·권리금 상한 + 입지 최적일 때만.
  #   입지 최적 = 싼동네(rent_low_manwon_py 이하) + 초중고 school_radius_m 안 —
  #   장기 생존 매장들의 공통 프로파일 (아래 입지 라벨과 같은 데이터·기준). 드물게 뜨는 게 정상.
  # 🟡 검토 = 필요잔수 ≤ review_cups (권리금 0이면 월세 ~114만 상당) / 🔴 예산초과 = 초과.
  budget:
    cup_margin_won: 1300       # 잔당 공헌이익(원) — STRATEGY §12
    fixed_cost_manwon: 25      # 월세 외 월 고정비 가정치 (관리비·전기·수도·인터넷)
    base_invest_manwon: 1000   # 무권리 기준 초기투자 (머신·간판·CCTV 등, §11 상한)
    payback_months: 18         # 회수 상한 — §17 "18개월 이내"
    green_cups: 40             # 💚 — 목표 하단 40잔으로 회수 성립 (월세 ~75만 상당)
    review_cups: 50            # 🟡 — 목표 상단 50잔까지
    green_deposit: 2000        # 💚 보증금 상한 (만원)
    green_premium: 300         # 💚 권리금 상한 — §11 권리금 0~300
  # 입지 라벨 (2026-08-24 서울 무인카페 2019~22 개업 487건 장기생존/조기폐업 분석, cafe-log RESEARCH §11)
  #  🏫 학교권  — 초중고가 이 거리 안 (450m 안에 학교 없으면 3년 생존 44% vs 72%. 가장 단단한 변수)
  #  💸 싼동네  — 행정동 1층 평당 월 환산임대료(원/3.3㎡, 보증금×12%/12+월세) ≤ rent_low (만원)
  #  💰 비싼동네 — ≥ rent_high (상위 1/3, 3년 생존 52% vs 76%)
  #  🚫 위험입지 — 비싼동네 + 역 station_radius_m 안 (3년 생존 37%). 역세권은 비싼 동에서만 나쁘다.
  #  (🏥 병원세권은 데이터 근거가 없어 제거 — 병원 600m 내 58%로 오히려 낮은 쪽)
  school_radius_m: 300
  school_show_m: 450          # 이 거리 안이면 학교 이름·거리를 본문에 표시
  rent_low_manwon_py: 13.0
  rent_high_manwon_py: 15.6
  station_radius_m: 364
  # 🏘 줄의 "이 매물 평당" 시세 비교 — 동 평균이 1층 기준이라 1층만, 면적 이상치 가드
  compare_py_min: 3.0
  compare_py_max: 30.0

  # 이 월세를 넘으면 알림하지 않는다. 월세 300이면 필요잔수 ~98잔/일 — 시장 상위
  # 매출로도 회수가 성립하지 않는 구간이라 검토 가치가 없다. 0이면 상한 없음.
  # (예산 라벨의 필요잔수와 축이 다른 단순 월세 컷 — 라벨은 통과분 안에서만 계산된다)
  max_monthly_manwon: 300
  # 빠른 감지 레인이 폴링할 카테고리 페이지 (서울 25개 구 × 카테고리 수만큼 요청)
  fast_categories: ["상가"]
  # 규칙 중 하나라도 맞으면 알림. categories가 빈 리스트면 매물 종류 무관.
  # 매물 종류: 원룸 빌라 아파트 오피스텔 상가 사무실 건물 토지
  rules:
    # 2026-08-21: categories가 비어 있어 주택 매물의 "동네에 각종 무인시설(빨래,탁구)" 같은
    # 편의시설 설명까지 걸렸다. 상업용 종류로 한정하고 편의시설 표현을 제외어에 추가.
    - name: "무인 매장"
      categories: ["상가", "사무실", "건물"]
      keywords: ["무인"]
      exclude_keywords:
        - "무인택배"
        - "무인 택배"
        - "무인세탁"
        - "무인 세탁"
        - "무인경비"
        - "무인 경비"
        - "무인시설"
        - "무인 시설"
        - "무인주차"
        - "무인 주차"
    # 2026-08-21 알림 28건 전수 분석: 양도/권리금/인수 키워드가 오탐의 94%(식당·당구장·학원 등
    # 업종 무관 상가 17건)를 만들었고, 진짜 관련 매물 11건은 전부 본문에 카페/커피/무인이 직접 등장.
    # → 카페/커피만 남김. 되돌리려면 keywords에 "양도" 등을 다시 추가.
    - name: "카페/양도 (상가)"
      categories: ["상가"]
      keywords: ["카페", "커피"]
      exclude_keywords: []
  # true면 규칙 무시하고 지역만으로 전부 알림 — 알림량 확인용 스위치
  unfiltered: false

buysell:
  enabled: true
  freshness_days: 3   # 등록된 지 이 일수 넘은 매물은 알리지 않음 (첫 순회 폭주 방지)
  # 검색어별로 서울 전체 동을 회전 순회하며 폴링. min_price(원) 미만은 노이즈로 버림.
  # aliases: 판매글 표기 변형 — 본문에 키워드 또는 별칭 중 하나만 있으면 매칭 인정.
  searches:
    - keyword: "제빙기"
      min_price: 300000
      aliases: ["아이스메이커", "아이스 메이커"]
    - keyword: "커피머신"
      min_price: 500000
      aliases: ["커피 머신", "에스프레소 머신", "에스프레소머신", "커피 기계", "커피기계"]
    - keyword: "에스프레소 머신"
      min_price: 500000
      aliases: ["커피머신", "커피 머신", "에스프레소머신"]
    - keyword: "키오스크"
      min_price: 300000
    # 폐업하며 집기를 통째로 넘기는 건 — 무료나눔보다 실속 있다.
    # (2026-08 실측: 카페용 집기 나눔은 사실상 0건, 나눔은 전부 가정용 가구였다)
    - keyword: "카페 폐업"
      min_price: 0
      # 진짜 폐업 정리 글에는 장비·집기 단어가 반드시 나온다 — 굿즈 "정리" 차단 (2026-08-24)
      require_any: ["머신", "제빙기", "그라인더", "키오스크", "냉장고", "쇼케이스", "오븐",
                    "집기", "테이블", "의자", "포스", "싱크", "업소용", "커피", "원두", "매장", "폐업"]
      aliases: ["카페폐업", "커피숍 폐업", "카페 정리", "카페 집기"]
      # '○○카페'는 커피집이 아닌 다른 업종이다 (만화카페 폐업 → 만화책 500원 등)
      exclude_keywords: ["만화카페", "만화 카페", "룸카페", "룸 카페", "스터디카페",
                         "스터디 카페", "키즈카페", "키즈 카페", "애견카페", "애견 카페",
                         "보드카페", "보드 카페", "PC카페", "피시카페", "만화방", "만화책", "코믹스"]
    - keyword: "폐업 일괄"
      min_price: 0
      aliases: ["폐업일괄", "집기 일괄", "집기일괄", "폐업 정리"]
    # 🔥 양도 — 당근 중고거래에 "무인카페 양도합니다" 글이 부동산이 아니라 일반 판매로 올라온다.
    # handover: true면 🔥 우선순위 (글에 '무인' 있으면 무인카페 양도, 없으면 카페 양도)
    - keyword: "무인카페 양도"
      min_price: 0
      handover: true
      require_any: ["권리금", "보증금", "월세", "매출", "머신", "제빙기", "키오스크", "집기",
                    "시설", "기계", "매장 양도", "점포", "상가", "양도양수", "임대", "사업자"]
      aliases: ["무인카페양도", "무인 카페 양도", "카페 양도", "카페양도", "무인카페 매매",
                "무인카페 인수", "카페 인수", "카페 넘깁니다", "무인카페 넘깁니다", "커피숍 양도"]
      exclude_keywords: ["만화카페", "만화 카페", "룸카페", "룸 카페", "스터디카페", "스터디 카페",
                         "키즈카페", "키즈 카페", "애견카페", "애견 카페", "보드카페", "보드 카페",
                         "PC카페", "피시카페", "북카페", "사진카페", "파티룸",
                         "특전", "포카", "포토카드", "굿즈", "럭드", "생카", "생일 카페", "생일카페",
                         "콜라보", "엽서", "키링", "분철", "응원봉", "포토홀더", "컵홀더", "탑로더", "미공포"]

# 번개장터 중고 장비 (공개 JSON API, 최신순)
bunjang:
  enabled: true
  freshness_days: 3
  include_no_region: true   # 지역 미표기 매물도 알림 (번개는 절반 가까이가 미표기 — 택배 거래 많음)
  regions: ["서울"]
  searches:
    - keyword: "제빙기"
      min_price: 300000
      aliases: ["아이스메이커", "아이스 메이커"]
    - keyword: "커피머신"
      min_price: 500000
      aliases: ["커피 머신", "에스프레소 머신", "에스프레소머신", "커피 기계", "커피기계"]
    - keyword: "무인카페"
      min_price: 1000000
      aliases: ["무인 카페"]
    - keyword: "키오스크"
      min_price: 300000
    - keyword: "카페 폐업"
      min_price: 0
      # 진짜 폐업 정리 글에는 장비·집기 단어가 반드시 나온다 — 굿즈 "정리" 차단 (2026-08-24)
      require_any: ["머신", "제빙기", "그라인더", "키오스크", "냉장고", "쇼케이스", "오븐",
                    "집기", "테이블", "의자", "포스", "싱크", "업소용", "커피", "원두", "매장", "폐업"]
      aliases: ["카페폐업", "커피숍 폐업", "카페 정리", "카페 집기"]
      # '○○카페'는 커피집이 아닌 다른 업종이다 (만화카페 폐업 → 만화책 500원 등)
      exclude_keywords: ["만화카페", "만화 카페", "룸카페", "룸 카페", "스터디카페",
                         "스터디 카페", "키즈카페", "키즈 카페", "애견카페", "애견 카페",
                         "보드카페", "보드 카페", "PC카페", "피시카페", "만화방", "만화책", "코믹스"]
    # 🔥 양도 — require_any가 핵심: 번개는 아이돌 생일카페 굿즈 '양도' 글이 압도적으로 많다
    - keyword: "카페 양도"
      min_price: 0
      handover: true
      require_any: ["권리금", "보증금", "월세", "매출", "머신", "제빙기", "키오스크", "집기",
                    "시설", "기계", "매장 양도", "점포", "상가", "양도양수", "임대", "사업자"]
      aliases: ["카페양도", "무인카페 양도", "무인카페양도", "카페 인수", "무인카페 매매", "커피숍 양도"]
      exclude_keywords: ["만화카페", "만화 카페", "룸카페", "룸 카페", "스터디카페", "스터디 카페",
                         "키즈카페", "키즈 카페", "애견카페", "애견 카페", "보드카페", "보드 카페",
                         "PC카페", "피시카페", "북카페", "사진카페", "파티룸",
                         "특전", "포카", "포토카드", "굿즈", "럭드", "생카", "생일 카페", "생일카페",
                         "콜라보", "엽서", "키링", "분철", "응원봉", "포토홀더", "컵홀더", "탑로더", "미공포"]

# 점포라인 서울 카페 양도 매물 (m.jumpoline.com, 최신 100건 고정)
jumpoline:
  enabled: true
  interval_min: 60          # 상업 사이트라 넉넉히
  detail_cap_per_run: 6     # 실행당 상세 조회 상한
  max_premium_manwon: 5000  # 권리금 상한(만원). STRATEGY 기준 0~300 선호, 여유 두고 5천만원
  keywords: []              # 비우면 카페 카테고리 전체. 예: ["무인", "테이크아웃"]
  priority: 1               # 점포라인은 전부 양도 매물 → 기본 🔥 카페 양도(1). 제목에 '무인'이 있으면 2. 0이면 일반 취급

poll:
  realty_delay_sec: 1.2        # 부동산 요청 간 대기
  bunjang_delay_sec: 1.0       # 번개장터 요청 간 대기
  jumpoline_delay_sec: 2.0     # 점포라인 요청 간 대기 (상업 사이트, 보수적으로)
  buysell_delay_sec: 0.5       # 중고거래 요청 간 대기
  fast_lane_interval_min: 25   # 구별 카테고리 페이지 폴링 주기 (CDN 캐시가 1시간이라 더 짧게는 무의미)
  sitemap_interval_hours: 4    # sitemap 백스톱 확인 주기 (하루 1회만 재생성됨)
  scan_budget_per_run: 100     # 실행당 sitemap 백스톱 제목 스캔 개수 (일 유입 ~6-8천건을 여유 있게 소화)
  fast_detail_cap_per_run: 40  # 실행당 빠른 감지 레인 상세 파싱 상한
  buysell_budget_per_run: 120  # 실행당 중고거래 (동×키워드) 검색 횟수
  max_alerts_per_run: 20       # 초과분은 다음 실행으로 이월
  state_max_age_days: 90
  photos: true                 # 알림에 매물 사진 첨부
  price_watch_per_run: 8       # 실행당 가격 인하 재확인(부동산) 개수
  digest_hour_kst: 8           # 아침 브리핑 발송 시각 (KST, 이 시각 이후 첫 실행에서 1회)
