# 당근 매물 알림 설정
# 키워드는 본문(부동산) / 제목+본문(중고거래)에서 부분 일치로 검사한다.

realty:
  enabled: true
  freshness_days: 7   # 등록된 지 이 일수 넘은 매물은 알리지 않음 (큐레이션 변동으로 옛 매물이 갑자기 노출되는 경우 방지)
  # 주소가 이 문자열로 시작하면 통과 (예: "서울특별시", "경기도 성남시")
  regions:
    - "서울특별시"
  # 거래 유형: MONTH(월세) BORROW(전세) BUY(매매) SHORT(단기)
  # 월세만 본다. 매매·전세는 목적에 안 맞고, 단기는 카페 창업에 부적합. 비우면 전체 허용.
  trade_types: ["MONTH"]

  # 예산 라벨 — 거르지 않고 알림 앞에 표시만 한다 (STRATEGY §12: 월세 싼 게 목표가 아님).
  # 단위: 만원. 세 조건을 모두 만족하면 소액창업, 월세가 review 이하면 검토, 그 외 예산초과.
  budget:
    starter_monthly: 60      # 💚 소액창업 — STRATEGY §7 "매우 좋음~좋음" 구간
    starter_deposit: 1000
    starter_premium: 300     # STRATEGY §11 권리금 0~300
    review_monthly: 120      # 🟡 검토 — §7 "100만원 이상 신중"에 여유
  # 이 거리(m) 안에 대형병원이 있으면 🏥 병원세권 라벨. 목록은 hospitals.json.
  hospital_radius_m: 600

  # 이 월세를 넘으면 알림하지 않는다. 하루 50잔(월 공헌이익 195만원)으로도
  # 계산이 성립하지 않는 구간이라 검토 가치가 없다. 0이면 상한 없음.
  max_monthly_manwon: 300
  # 빠른 감지 레인이 폴링할 카테고리 페이지 (서울 25개 구 × 카테고리 수만큼 요청)
  fast_categories: ["상가"]
  # 규칙 중 하나라도 맞으면 알림. categories가 빈 리스트면 매물 종류 무관.
  # 매물 종류: 원룸 빌라 아파트 오피스텔 상가 사무실 건물 토지
  rules:
    # 2026-08-21: categories가 비어 있어 주택 매물의 "동네에 각종 무인시설(빨래,탁구)" 같은
    # 편의시설 설명까지 걸렸다. 상업용 종류로 한정하고 편의시설 표현을 제외어에 추가.
    - name: "무인 매장"
      categories: ["상가", "사무실", "건물"]
      keywords: ["무인"]
      exclude_keywords:
        - "무인택배"
        - "무인 택배"
        - "무인세탁"
        - "무인 세탁"
        - "무인경비"
        - "무인 경비"
        - "무인시설"
        - "무인 시설"
        - "무인주차"
        - "무인 주차"
    # 2026-08-21 알림 28건 전수 분석: 양도/권리금/인수 키워드가 오탐의 94%(식당·당구장·학원 등
    # 업종 무관 상가 17건)를 만들었고, 진짜 관련 매물 11건은 전부 본문에 카페/커피/무인이 직접 등장.
    # → 카페/커피만 남김. 되돌리려면 keywords에 "양도" 등을 다시 추가.
    - name: "카페/양도 (상가)"
      categories: ["상가"]
      keywords: ["카페", "커피"]
      exclude_keywords: []
  # true면 규칙 무시하고 지역만으로 전부 알림 — 알림량 확인용 스위치
  unfiltered: false

buysell:
  enabled: true
  freshness_days: 3   # 등록된 지 이 일수 넘은 매물은 알리지 않음 (첫 순회 폭주 방지)
  # 검색어별로 서울 전체 동을 회전 순회하며 폴링. min_price(원) 미만은 노이즈로 버림.
  # aliases: 판매글 표기 변형 — 본문에 키워드 또는 별칭 중 하나만 있으면 매칭 인정.
  searches:
    - keyword: "제빙기"
      min_price: 300000
      aliases: ["아이스메이커", "아이스 메이커"]
    - keyword: "커피머신"
      min_price: 500000
      aliases: ["커피 머신", "에스프레소 머신", "에스프레소머신", "커피 기계", "커피기계"]
    - keyword: "에스프레소 머신"
      min_price: 500000
      aliases: ["커피머신", "커피 머신", "에스프레소머신"]
    - keyword: "키오스크"
      min_price: 300000
    # 폐업하며 집기를 통째로 넘기는 건 — 무료나눔보다 실속 있다.
    # (2026-08 실측: 카페용 집기 나눔은 사실상 0건, 나눔은 전부 가정용 가구였다)
    - keyword: "카페 폐업"
      min_price: 0
      aliases: ["카페폐업", "커피숍 폐업", "카페 정리", "카페 집기"]
      # '○○카페'는 커피집이 아닌 다른 업종이다 (만화카페 폐업 → 만화책 500원 등)
      exclude_keywords: ["만화카페", "만화 카페", "룸카페", "룸 카페", "스터디카페",
                         "스터디 카페", "키즈카페", "키즈 카페", "애견카페", "애견 카페",
                         "보드카페", "보드 카페", "PC카페", "피시카페", "만화방", "만화책", "코믹스"]
    - keyword: "폐업 일괄"
      min_price: 0
      aliases: ["폐업일괄", "집기 일괄", "집기일괄", "폐업 정리"]

# 번개장터 중고 장비 (공개 JSON API, 최신순)
bunjang:
  enabled: true
  freshness_days: 3
  include_no_region: true   # 지역 미표기 매물도 알림 (번개는 절반 가까이가 미표기 — 택배 거래 많음)
  regions: ["서울"]
  searches:
    - keyword: "제빙기"
      min_price: 300000
      aliases: ["아이스메이커", "아이스 메이커"]
    - keyword: "커피머신"
      min_price: 500000
      aliases: ["커피 머신", "에스프레소 머신", "에스프레소머신", "커피 기계", "커피기계"]
    - keyword: "무인카페"
      min_price: 1000000
      aliases: ["무인 카페"]
    - keyword: "키오스크"
      min_price: 300000
    - keyword: "카페 폐업"
      min_price: 0
      aliases: ["카페폐업", "커피숍 폐업", "카페 정리", "카페 집기"]
      # '○○카페'는 커피집이 아닌 다른 업종이다 (만화카페 폐업 → 만화책 500원 등)
      exclude_keywords: ["만화카페", "만화 카페", "룸카페", "룸 카페", "스터디카페",
                         "스터디 카페", "키즈카페", "키즈 카페", "애견카페", "애견 카페",
                         "보드카페", "보드 카페", "PC카페", "피시카페", "만화방", "만화책", "코믹스"]

# 점포라인 서울 카페 양도 매물 (m.jumpoline.com, 최신 100건 고정)
jumpoline:
  enabled: true
  interval_min: 60          # 상업 사이트라 넉넉히
  detail_cap_per_run: 6     # 실행당 상세 조회 상한
  max_premium_manwon: 5000  # 권리금 상한(만원). STRATEGY 기준 0~300 선호, 여유 두고 5천만원
  keywords: []              # 비우면 카페 카테고리 전체. 예: ["무인", "테이크아웃"]

poll:
  realty_delay_sec: 1.2        # 부동산 요청 간 대기
  bunjang_delay_sec: 1.0       # 번개장터 요청 간 대기
  jumpoline_delay_sec: 2.0     # 점포라인 요청 간 대기 (상업 사이트, 보수적으로)
  buysell_delay_sec: 0.5       # 중고거래 요청 간 대기
  fast_lane_interval_min: 25   # 구별 카테고리 페이지 폴링 주기 (CDN 캐시가 1시간이라 더 짧게는 무의미)
  sitemap_interval_hours: 4    # sitemap 백스톱 확인 주기 (하루 1회만 재생성됨)
  scan_budget_per_run: 100     # 실행당 sitemap 백스톱 제목 스캔 개수 (일 유입 ~6-8천건을 여유 있게 소화)
  fast_detail_cap_per_run: 40  # 실행당 빠른 감지 레인 상세 파싱 상한
  buysell_budget_per_run: 120  # 실행당 중고거래 (동×키워드) 검색 횟수
  max_alerts_per_run: 20       # 초과분은 다음 실행으로 이월
  state_max_age_days: 90
  photos: true                 # 알림에 매물 사진 첨부
  price_watch_per_run: 8       # 실행당 가격 인하 재확인(부동산) 개수
  digest_hour_kst: 8           # 아침 브리핑 발송 시각 (KST, 이 시각 이후 첫 실행에서 1회)
